<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Deep starless void of space (upper-left negative space) -->
    <linearGradient id="sci-void" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000204"/>
      <stop offset="55%" stop-color="#01060a"/>
      <stop offset="100%" stop-color="#030c12"/>
    </linearGradient>

    <!-- Electric-teal atmospheric rim gradient -->
    <linearGradient id="electric-teal-rim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#042f2e" stop-opacity="0.3"/>
      <stop offset="20%" stop-color="#0d9488" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="90%" stop-color="#a5f3fc" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Aurora borealis gradient (curling ribbon of green light) -->
    <linearGradient id="aurora-ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0"/>
      <stop offset="25%" stop-color="#10b981" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#6ee7b7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <!-- Atmospheric diffuse halo in lower-right -->
    <radialGradient id="atmo-diffuse" cx="80%" cy="85%" r="65%">
      <stop offset="40%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="66%" stop-color="#022c22" stop-opacity="0.3"/>
      <stop offset="74%" stop-color="#064e3b" stop-opacity="0.45"/>
      <stop offset="80%" stop-color="#0891b2" stop-opacity="0.35"/>
      <stop offset="88%" stop-color="#0e7490" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Bloom and glow filters -->
    <filter id="aurora-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="city-emerald-bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="bloom"/>
      <feGaussianBlur stdDeviation="2.5" result="sharp"/>
      <feMerge>
        <feMergeNode in="bloom"/>
        <feMergeNode in="sharp"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cloud-haze" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <!-- Emerald-Green City Megaclusters Radial Gradients -->
    <radialGradient id="cluster-emerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="18%" stop-color="#d1fae5" stop-opacity="0.95"/>
      <stop offset="42%" stop-color="#34d399" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cluster-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0fdf4" stop-opacity="1"/>
      <stop offset="22%" stop-color="#a5f3fc" stop-opacity="0.95"/>
      <stop offset="48%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#0891b2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>

    <!-- Planet base surface -->
    <linearGradient id="earth-body" x1="40%" y1="40%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02080d"/>
      <stop offset="50%" stop-color="#041017"/>
      <stop offset="100%" stop-color="#010609"/>
    </linearGradient>

    <linearGradient id="continent-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06131c"/>
      <stop offset="60%" stop-color="#091b26"/>
      <stop offset="100%" stop-color="#051017"/>
    </linearGradient>

    <!-- Grid pattern for scanning readout overlay -->
    <pattern id="scan-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#06b6d4" stroke-width="0.75" stroke-opacity="0.07" stroke-dasharray="3,3"/>
      <circle cx="48" cy="0" r="1.2" fill="#10b981" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Deep Black Void (Negative Space in Upper-Left Two-Thirds) -->
  <rect width="1920" height="1080" fill="url(#sci-void)"/>

  <!-- Atmospheric Glow Envelope in Lower-Right -->
  <ellipse cx="1600" cy="1150" rx="1100" ry="800" fill="url(#atmo-diffuse)"/>

  <!-- Earth Body (Lower-Right Third of Frame) -->
  <path d="M 640 1080 C 820 800, 1140 560, 1920 440 L 1920 1080 L 640 1080 Z" fill="url(#earth-body)"/>

  <!-- Continents and Landmass Silhouettes -->
  <path d="M 780 1080 C 860 920, 960 840, 1080 770 C 1190 705, 1310 650, 1480 600 C 1620 560, 1750 530, 1920 510 L 1920 1080 Z" fill="url(#continent-dark)"/>
  <path d="M 1040 850 C 1140 780, 1260 760, 1370 710 C 1460 670, 1580 680, 1690 620 C 1800 570, 1860 550, 1920 535 L 1920 1080 L 1040 1080 Z" fill="#061219"/>

  <!-- Subtle Data-Grid Scanning Readout Lines on Ocean Areas -->
  <g id="scanning-readout">
    <!-- Grid fill clipped to lower right -->
    <path d="M 640 1080 C 820 800, 1140 560, 1920 440 L 1920 1080 L 640 1080 Z" fill="url(#scan-grid)"/>

    <!-- Orbital survey scan arcs (latitude arcs following curvature) -->
    <path d="M 700 1080 C 870 820, 1170 600, 1920 480" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.12" fill="none" stroke-dasharray="6,8"/>
    <path d="M 800 1080 C 950 860, 1220 660, 1920 560" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.1" fill="none" stroke-dasharray="4,6"/>
    <path d="M 940 1080 C 1070 910, 1310 740, 1920 660" stroke="#06b6d4" stroke-width="0.75" stroke-opacity="0.08" fill="none" stroke-dasharray="3,7"/>

    <!-- Radial Meridian Lines converging toward Earth horizon -->
    <line x1="880" y1="1080" x2="1080" y2="760" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.1" stroke-dasharray="2,5"/>
    <line x1="1120" y1="1080" x2="1320" y2="680" stroke="#06b6d4" stroke-width="0.8" stroke-opacity="0.1" stroke-dasharray="2,5"/>
    <line x1="1380" y1="1080" x2="1560" y2="600" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.09" stroke-dasharray="2,5"/>
    <line x1="1640" y1="1080" x2="1780" y2="520" stroke="#06b6d4" stroke-width="0.8" stroke-opacity="0.08" stroke-dasharray="2,5"/>

    <!-- Sci-Fi Target Reticles and Telemetry Markers -->
    <circle cx="950" cy="850" r="32" stroke="#10b981" stroke-width="0.75" stroke-opacity="0.15" fill="none" stroke-dasharray="4,4"/>
    <circle cx="950" cy="850" r="4" fill="#34d399" fill-opacity="0.25"/>
    <line x1="910" y1="850" x2="990" y2="850" stroke="#10b981" stroke-width="0.5" stroke-opacity="0.2"/>
    <line x1="950" y1="810" x2="950" y2="890" stroke="#10b981" stroke-width="0.5" stroke-opacity="0.2"/>

    <circle cx="1280" cy="760" r="24" stroke="#06b6d4" stroke-width="0.75" stroke-opacity="0.14" fill="none" stroke-dasharray="3,3"/>
    <circle cx="1280" cy="760" r="2.5" fill="#06b6d4" fill-opacity="0.3"/>
  </g>

  <!-- Striking Emerald-Green and Cyan City Lights -->
  <g id="city-megaclusters" filter="url(#city-emerald-bloom)">
    <!-- Primary Major Metropolises (Bright cyan & emerald hubs) -->
    <circle cx="1520" cy="620" r="70" fill="url(#cluster-emerald)" opacity="0.98"/>
    <circle cx="1740" cy="540" r="62" fill="url(#cluster-cyan)" opacity="0.98"/>
    <circle cx="1320" cy="710" r="65" fill="url(#cluster-emerald)" opacity="0.92"/>
    <circle cx="1650" cy="740" r="82" fill="url(#cluster-cyan)" opacity="0.96"/>
    <circle cx="1430" cy="830" r="75" fill="url(#cluster-emerald)" opacity="0.92"/>
    <circle cx="1180" cy="830" r="58" fill="url(#cluster-cyan)" opacity="0.88"/>
    <circle cx="1860" cy="660" r="52" fill="url(#cluster-emerald)" opacity="0.9"/>
    <circle cx="1260" cy="940" r="60" fill="url(#cluster-emerald)" opacity="0.86"/>
    <circle cx="1580" cy="920" r="72" fill="url(#cluster-cyan)" opacity="0.92"/>
    <circle cx="1020" cy="960" r="46" fill="url(#cluster-emerald)" opacity="0.82"/>

    <!-- High-Density Urban Corridors & Filaments -->
    <path d="M 1180 830 Q 1250 770 1320 710 T 1420 670 T 1520 620 T 1630 580 T 1740 540 T 1860 510" stroke="#6ee7b7" stroke-width="3" stroke-opacity="0.85" fill="none" stroke-dasharray="2,3,9,2"/>
    <path d="M 1320 710 Q 1380 770 1430 830 T 1580 920 T 1720 980" stroke="#34d399" stroke-width="2.5" stroke-opacity="0.8" fill="none"/>
    <path d="M 1520 620 Q 1590 680 1650 740 T 1780 790 T 1890 820" stroke="#a5f3fc" stroke-width="3" stroke-opacity="0.85" fill="none"/>
    <path d="M 1430 830 Q 1540 790 1650 740" stroke="#06b6d4" stroke-width="2.2" stroke-opacity="0.75" fill="none"/>
    <path d="M 1020 960 Q 1100 890 1180 830 T 1260 940 T 1430 830" stroke="#10b981" stroke-width="2" stroke-opacity="0.7" fill="none"/>
    <path d="M 1740 540 Q 1800 600 1860 660 T 1920 710" stroke="#6ee7b7" stroke-width="2.5" stroke-opacity="0.8" fill="none"/>

    <!-- Bright White-Green City Cores -->
    <g fill="#ffffff" opacity="0.98">
      <circle cx="1515" cy="615" r="4.5"/><circle cx="1528" cy="624" r="3.8"/><circle cx="1505" cy="628" r="3.2"/><circle cx="1538" cy="610" r="3.5"/>
      <circle cx="1735" cy="535" r="4.2"/><circle cx="1748" cy="542" r="3.6"/><circle cx="1725" cy="548" r="3"/>
      <circle cx="1315" cy="705" r="4"/><circle cx="1328" cy="714" r="3.5"/><circle cx="1306" cy="718" r="2.8"/>
      <circle cx="1645" cy="735" r="4.8"/><circle cx="1658" cy="744" r="4"/><circle cx="1635" cy="748" r="3.4"/><circle cx="1668" cy="730" r="3.6"/>
      <circle cx="1425" cy="825" r="4.2"/><circle cx="1438" cy="834" r="3.5"/><circle cx="1415" cy="838" r="3"/>
      <circle cx="1175" cy="825" r="3.8"/><circle cx="1186" cy="832" r="3.2"/>
      <circle cx="1855" cy="655" r="3.6"/><circle cx="1866" cy="664" r="3.2"/>
      <circle cx="1575" cy="915" r="4"/><circle cx="1588" cy="924" r="3.5"/>
      <circle cx="1255" cy="935" r="3.5"/><circle cx="1015" cy="955" r="3.2"/>
    </g>

    <!-- Emerald and Cyan Light Clusters -->
    <g fill="#6ee7b7" opacity="0.95">
      <circle cx="1470" cy="640" r="3"/><circle cx="1485" cy="632" r="2.6"/><circle cx="1498" cy="645" r="3.2"/><circle cx="1545" cy="635" r="3.4"/><circle cx="1560" cy="625" r="2.8"/><circle cx="1575" cy="642" r="3"/>
      <circle cx="1690" cy="565" r="3"/><circle cx="1710" cy="552" r="3.2"/><circle cx="1760" cy="558" r="3"/><circle cx="1780" cy="548" r="2.6"/><circle cx="1800" cy="535" r="3"/>
      <circle cx="1270" cy="730" r="2.8"/><circle cx="1290" cy="722" r="3"/><circle cx="1340" cy="728" r="3.2"/><circle cx="1360" cy="718" r="2.8"/><circle cx="1380" cy="735" r="2.6"/>
      <circle cx="1600" cy="760" r="3.2"/><circle cx="1620" cy="752" r="3.4"/><circle cx="1670" cy="758" r="3.6"/><circle cx="1690" cy="745" r="3"/><circle cx="1710" cy="762" r="2.8"/>
      <circle cx="1370" cy="850" r="3"/><circle cx="1395" cy="840" r="3.2"/><circle cx="1450" cy="848" r="3.4"/><circle cx="1475" cy="838" r="2.8"/>
      <circle cx="1530" cy="940" r="3"/><circle cx="1555" cy="930" r="3.2"/><circle cx="1610" cy="938" r="3.4"/><circle cx="1635" cy="925" r="2.8"/>
    </g>

    <!-- Electric-cyan secondary points -->
    <g fill="#22d3ee" opacity="0.9">
      <circle cx="980" cy="980" r="2.2"/><circle cx="1000" cy="970" r="2"/><circle cx="1045" cy="950" r="2.4"/><circle cx="1070" cy="935" r="2.2"/><circle cx="1110" cy="910" r="2.6"/><circle cx="1135" cy="890" r="2.2"/>
      <circle cx="1140" cy="860" r="2.4"/><circle cx="1210" cy="810" r="2.6"/><circle cx="1230" cy="790" r="2.2"/><circle cx="1260" cy="770" r="2.4"/><circle cx="1350" cy="760" r="2.6"/><circle cx="1370" cy="790" r="2.2"/>
      <circle cx="1410" cy="880" r="2.2"/><circle cx="1450" cy="890" r="2.6"/><circle cx="1480" cy="870" r="2.4"/><circle cx="1510" cy="860" r="2.2"/><circle cx="1550" cy="850" r="2.6"/><circle cx="1600" cy="830" r="2.4"/>
      <circle cx="1660" cy="800" r="2.4"/><circle cx="1700" cy="780" r="2.6"/><circle cx="1740" cy="760" r="2.2"/><circle cx="1770" cy="740" r="2.4"/><circle cx="1820" cy="710" r="2.6"/><circle cx="1840" cy="690" r="2.2"/>
    </g>
  </g>

  <!-- Faint Aurora-Like Ribbon of Green Light Curling Along Horizon -->
  <g id="aurora-borealis" filter="url(#aurora-blur)">
    <!-- Undulating ribbon path above the curved horizon -->
    <path d="M 620 1070 C 760 840, 920 740, 1140 650 C 1340 560, 1580 500, 1930 400" stroke="url(#aurora-ribbon)" stroke-width="48" fill="none" opacity="0.55"/>
    <path d="M 660 1050 C 800 810, 990 700, 1220 610 C 1440 520, 1680 470, 1930 380" stroke="#34d399" stroke-width="20" stroke-opacity="0.4" fill="none"/>
    <path d="M 720 1020 C 880 780, 1080 670, 1320 580 C 1520 500, 1750 440, 1930 360" stroke="#06b6d4" stroke-width="12" stroke-opacity="0.3" fill="none"/>
  </g>

  <!-- Thin Electric-Teal Atmospheric Rim Light -->
  <g id="atmospheric-rim">
    <!-- Diffuse outer glow -->
    <path d="M 630 1090 C 810 800, 1135 555, 1930 435" stroke="#0d9488" stroke-width="28" stroke-opacity="0.3" fill="none" filter="url(#aurora-blur)"/>

    <!-- Mid ionosphere electric teal/cyan band -->
    <path d="M 636 1084 C 816 800, 1138 558, 1925 438" stroke="url(#electric-teal-rim)" stroke-width="8" stroke-opacity="0.85" fill="none"/>

    <!-- Razor-sharp electric rim edge -->
    <path d="M 640 1080 C 820 800, 1140 560, 1920 440" stroke="#22d3ee" stroke-width="2.5" fill="none"/>
    <path d="M 700 970 C 880 750, 1180 550, 1920 438" stroke="#a5f3fc" stroke-width="1.2" stroke-opacity="0.95" fill="none"/>
  </g>

  <!-- Subtle Thin Cloud Wisps -->
  <g id="cloud-wisps" opacity="0.1" filter="url(#cloud-haze)">
    <path d="M 880 920 C 1020 840, 1180 810, 1340 760 C 1460 720, 1620 680, 1780 620 C 1680 700, 1500 750, 1340 810 C 1180 870, 1020 940, 880 920 Z" fill="#ccfbf1"/>
    <path d="M 1200 720 C 1360 650, 1540 600, 1720 540 C 1820 510, 1900 480, 1940 470 C 1900 520, 1780 570, 1640 640 C 1480 710, 1340 760, 1200 720 Z" fill="#ecfdf5"/>
    <path d="M 1120 960 C 1280 900, 1460 880, 1640 830 C 1780 790, 1880 770, 1940 760 C 1880 810, 1740 860, 1580 910 C 1420 960, 1260 990, 1120 960 Z" fill="#cffafe"/>
  </g>
</svg>